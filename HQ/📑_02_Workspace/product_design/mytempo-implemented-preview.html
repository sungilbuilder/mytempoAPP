<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이템포 — 구현된 화면 미리보기 (2026-07-31)</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* tailwind.config.js / constants/theme.ts 와 동일한 값 */
  --bg:#FBFAF6; --surface:#FFFFFF; --surface2:#F2F0E8; --line:#E7E4D9;
  --ink:#16211A; --muted:#5F6C5C; --subtle:#8A9382; --track:#F0EEE6;
  --primary:#3F6136; --accent:#D9B84A; --onPrimary:#FFFFFF;
}
.dark{
  --bg:#0D110D; --surface:#161C15; --surface2:#222A20; --line:#2C3629;
  --ink:#F2F5EE; --muted:#7E8A79; --subtle:#5C6659; --track:#232C21;
  --primary:#7ED45C; --accent:#E9CE6C; --onPrimary:#0A0F09;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#EDEAE0;font-family:'Noto Sans KR',sans-serif;color:#16211A;padding:48px 32px 80px}
.page{max-width:1400px;margin:0 auto}
h1{font-size:34px;font-weight:900;letter-spacing:-.02em;line-height:1.25}
.eyebrow{font-family:'Space Grotesk';font-size:12px;letter-spacing:.22em;color:#8A9382;margin-bottom:10px}
.lede{font-size:14px;line-height:1.85;color:#5F6C5C;max-width:760px;margin-top:12px}
.bar{display:flex;gap:8px;margin:28px 0 32px;flex-wrap:wrap;align-items:center}
button.t{font-family:inherit;font-size:13px;font-weight:700;padding:9px 18px;border-radius:999px;border:1px solid #D8D4C6;background:#fff;color:#16211A;cursor:pointer}
button.t.on{background:#3F6136;color:#fff;border-color:#3F6136}
.note{font-size:12px;color:#8A9382}

.grid{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
.cell{display:flex;flex-direction:column;gap:9px}
.cap{font-size:12.5px;font-weight:700;color:#26331F}
.subcap{font-size:11.5px;color:#6E7C66;max-width:300px;line-height:1.6}

/* 폰 프레임 */
.phone{width:300px;height:640px;border-radius:42px;padding:9px;background:#26331F;box-shadow:0 18px 40px rgba(38,51,31,.18);flex-shrink:0}
.dark .phone,.wrap.dark .phone{background:#000}
.screen{width:100%;height:100%;border-radius:34px;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden;position:relative}
.body{flex:1;overflow:hidden;padding:20px 18px 0}

/* 조각 */
.row{display:flex;align-items:center;justify-content:space-between}
.h1s{font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.cp{font-size:11.5px;font-weight:500;color:var(--subtle)}
.mut{font-size:11.5px;color:var(--muted)}
.num{font-family:'Space Grotesk';font-weight:700;color:var(--ink);letter-spacing:-.03em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.card.lg{border-radius:24px;padding:20px}
.btn{border-radius:18px;padding:14px;text-align:center;font-size:14px;font-weight:700}
.btn.pri{background:var(--primary);color:var(--onPrimary)}
.btn.acc{background:var(--accent);color:var(--onPrimary)}
.btn.gh{background:var(--surface2);border:1px solid var(--line);color:var(--ink)}
.tabbar{height:56px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;background:var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--subtle)}
.tab.on{color:var(--primary)}
.ring{position:relative;width:var(--rs);height:var(--rs);margin:0 auto}
.ring svg{position:absolute;inset:0}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.spin{animation:sp 2.6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sw{width:44px;height:26px;border-radius:999px;padding:3px;display:flex;align-items:center}
.sw.on{background:var(--primary);justify-content:flex-end}
.sw.off{background:var(--surface2);justify-content:flex-start}
.sw i{width:20px;height:20px;border-radius:999px;background:#fff;display:block}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg span{flex:1;text-align:center;font-size:10.5px;font-weight:500;padding:7px 6px;border-radius:10px;color:var(--muted)}
.seg span.on{background:var(--surface);color:var(--ink);font-weight:700}
.li{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.hr{height:1px;background:var(--line)}
</style>
</head>
<body>
<div class="page">
  <div class="eyebrow">IMPLEMENTED · 2026-07-31</div>
  <h1>마이템포 — 실제 코드에 반영된 화면</h1>
  <p class="lede">
    디자인 시안(Turn 3·4)을 <code>HQ/📤_03_Output_App</code>에 구현한 결과를 브라우저에서 확인용으로 옮겨 그린 것입니다.
    색·간격·라운드·타이포는 <code>tailwind.config.js</code>와 같은 값을 씁니다.
    실제 동작(오디오·진동·저장·애니메이션)은 폰에서 <code>npm run go</code>로 확인해주세요.
  </p>

  <div class="bar">
    <button class="t on" id="bl">라이트</button>
    <button class="t" id="bd">다크</button>
    <span class="note">· 탭해서 두 모드를 비교해보세요. 레이아웃·간격은 100% 동일하고 색 토큰만 교체됩니다.</span>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
const RING = (ratio, size, spin) => {
  const R = 42, C = 2 * Math.PI * R;
  const back = C * (ratio / (ratio + 1));
  return `<div class="ring" style="--rs:${size}px">
    <svg viewBox="0 0 100 100" width="${size}" height="${size}">
      <circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--track)" stroke-width="9"/>
      <circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" transform="rotate(-90 50 50)" stroke-dasharray="${C}"/>
      <circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--primary)" stroke-width="9" stroke-linecap="round" transform="rotate(-90 50 50)" stroke-dasharray="${back} ${C - back}"/>
    </svg>
    <svg viewBox="0 0 100 100" width="${size}" height="${size}" class="${spin ? 'spin' : ''}">
      <circle cx="50" cy="8" r="4.5" fill="var(--ink)"/>
    </svg>
    <div class="mid">__MID__</div>
  </div>`;
};
const ring = (ratio, size, mid, spin) => RING(ratio, size, spin).replace('__MID__', mid);

const TAB = (active) => `<div class="tabbar">
  ${[['홈','M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z'],
     ['내 스윙','circle'],['기록','M3 17l5.5-5.5 3.5 3.5L21 6']]
   .map(([label, d], i) => `<div class="tab ${i === active ? 'on' : ''}">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round">
        ${d === 'circle' ? '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/>' : `<path d="${d}"/>`}
      </svg><span>${label}</span></div>`).join('')}
</div>`;

const SCREENS = [
  ['① 홈 — 오늘의 연습', '앱을 켜면 누를 것이 하나만 보입니다', `
    <div class="body">
      <div class="row" style="align-items:flex-start;padding-bottom:26px">
        <div><div class="cp">오늘</div><div class="h1s" style="padding-top:2px">연습할까요</div></div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--subtle)" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
      </div>
      <div class="card lg" style="display:flex;flex-direction:column;align-items:center">
        <div style="align-self:flex-start"><div class="mut">이어서 연습</div><div class="cp" style="padding-top:2px">내 스윙 · 7/24 저장</div></div>
        <div style="padding:18px 0">${ring(3, 156, '<div class="num" style="font-size:38px">3:1</div><div class="cp" style="padding-top:2px">7월 드라이버</div>')}</div>
        <div class="btn acc" style="width:100%">▶  바로 연습 시작</div>
      </div>
      <div style="display:flex;gap:11px;padding-top:14px">
        <div class="card" style="flex:1"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.75"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5"/></svg><div style="font-size:13.5px;font-weight:700;padding-top:6px;color:var(--ink)">내 스윙 등록</div><div class="cp" style="padding-top:3px">영상에서 3곳 탭</div></div>
        <div class="card" style="flex:1"><svg width="21" height="21" viewBox="0 0 24 24"><rect x="3" y="13" width="4" height="8" rx="1.6" fill="var(--primary)"/><rect x="10" y="9" width="4" height="12" rx="1.6" fill="var(--primary)"/><rect x="17" y="5" width="4" height="16" rx="1.6" fill="var(--primary)"/></svg><div style="font-size:13.5px;font-weight:700;padding-top:6px;color:var(--ink)">템포 바꾸기</div><div class="cp" style="padding-top:3px">3종 프리셋</div></div>

        <span class="cp">이번 주</span>
        <span><span class="num" style="font-size:19px">4일</span> <span class="mut">· 48분</span></span>
      </div>
    </div>${TAB(0)}`],

  ['② 연습 — 재생 중', '화면 전체가 하나의 메트로놈. 골드는 여기 딱 한 곳', `
    <div class="body" style="display:flex;flex-direction:column">
      <div class="row"><span style="color:var(--subtle);font-size:17px">✕</span><span class="mut">내 스윙 · 7월 드라이버</span><span style="width:12px"></span></div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div class="cp" style="letter-spacing:.16em;padding-bottom:14px">BACKSWING : DOWNSWING</div>
        ${ring(3, 208, '<div class="num" style="font-size:52px">3:1</div>', true)}
        <div style="display:flex;gap:22px;padding-top:20px">
          <span style="display:flex;align-items:center;gap:6px"><i style="width:8px;height:8px;border-radius:999px;background:var(--primary);display:block"></i><span class="cp">백스윙 시작</span></span>
          <span style="display:flex;align-items:center;gap:6px"><i style="width:8px;height:8px;border-radius:999px;background:var(--accent);display:block"></i><span class="cp">임팩트</span></span>
        </div>
        <div class="cp" style="padding-top:18px">2분 14초 · 32스윙</div>
      </div>
      <div style="padding-bottom:16px">
        <div class="btn acc" style="box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 45%, transparent);padding:17px">■  정지</div>
        <div class="row" style="padding-top:13px">
          <span class="btn gh" style="padding:9px 14px;font-size:11.5px;font-weight:500">느리게</span>
          <span class="num" style="font-size:17px">1.0x</span>
          <span class="btn gh" style="padding:9px 14px;font-size:11.5px;font-weight:500">빠르게</span>
        </div>
      </div>
    </div>`],

  ['③ 프리셋 — 템포 고르기', '선택한 카드에만 테두리 + 체크', `
    <div class="body">
      <div style="color:var(--ink);font-size:17px;padding-bottom:18px">‹</div>
      <div class="h1s">템포 고르기</div>
      <div class="cp" style="padding-top:6px">먼저 고르고, 나중에 내 스윙으로 바꿀 수 있어요</div>
      <div style="display:flex;flex-direction:column;gap:11px;padding-top:20px">
        ${[['안정형','3:1','천천히 올리고 정확하게',75,1],['균형형','2.5:1','가장 무난한 기본 리듬',71.4,0],['파워형','3.5:1','길게 끌고 강하게',77.8,0]]
          .map(([n,r,d,p,on]) => `<div class="card ${on?'':''}" style="border-radius:24px;${on?'border:2px solid var(--primary)':''}">
            <div class="row"><div>
              <div style="display:flex;align-items:center;gap:7px"><span style="font-size:16px;font-weight:700;color:var(--ink)">${n}</span>
              ${on?'<span style="width:19px;height:19px;border-radius:999px;background:var(--primary);color:var(--onPrimary);font-size:11px;display:flex;align-items:center;justify-content:center">✓</span>':''}</div>
              <div class="cp" style="padding-top:4px">${d}</div></div>
              <div class="num" style="font-size:23px">${r}</div></div>
            <div style="display:flex;height:8px;border-radius:999px;overflow:hidden;margin-top:13px;background:var(--track)">
              <i style="width:${p}%;background:var(--primary)"></i><i style="flex:1;background:var(--accent)"></i></div>
          </div>`).join('')}
      </div>
      <div class="btn pri" style="margin-top:20px">이 템포로 연습</div>
    </div>`],

  ['④ 내 스윙 — 마킹 2/3', '한 번에 한 지점만. 되돌리기는 항상 보이게', `
    <div class="body" style="display:flex;flex-direction:column">
      <div class="row" style="padding-bottom:14px"><span style="color:var(--ink);font-size:17px">‹</span><span class="num" style="font-size:13px">2 / 3</span><span class="mut">되돌리기</span></div>
      <div class="h1s">클럽이 가장 높은 순간</div>
      <div class="cp" style="padding-top:6px">영상을 좌우로 밀어 프레임을 찾습니다</div>
      <div style="flex:1;margin:18px 0;border-radius:24px;background:var(--surface2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center">
        <div class="cp" style="font-family:'Space Grotesk';letter-spacing:.24em">SWING VIDEO</div>
        <div class="num" style="font-size:30px;padding-top:12px">0.98초</div>
        <div class="cp" style="padding-top:2px">프레임 29</div>
      </div>
      <div style="position:relative;height:34px;display:flex;align-items:center">
        <div style="height:6px;border-radius:999px;background:var(--track);width:100%"></div>
        <i style="position:absolute;left:14%;width:3px;height:20px;border-radius:999px;background:var(--primary)"></i>
        <i style="position:absolute;left:33%;width:18px;height:18px;margin-left:-9px;border-radius:999px;background:var(--surface);border:2px solid var(--primary)"></i>
      </div>
      <div class="row" style="padding-bottom:14px">
        ${[['시작','0.42s'],['탑','0.98s'],['임팩트','— —']].map(([a,b])=>`<div style="text-align:center"><div class="cp">${a}</div><div class="num" style="font-size:11.5px;padding-top:2px">${b}</div></div>`).join('')}
      </div>
      <div class="btn pri" style="margin-bottom:16px">여기가 탑이에요</div>
    </div>`],

  ['⑤ 결과 — 내 템포 저장', '숫자 하나로 보상감을 주는 화면', `
    <div class="body" style="display:flex;flex-direction:column">
      <div class="cp">내 스윙 템포</div>
      <div style="padding-top:18px">${ring(3.2, 176, '<div class="num" style="font-size:44px">3.2:1</div>')}</div>
      <div class="mut" style="text-align:center;padding-top:12px">0.56s : 0.18s</div>
      <div class="card" style="border-radius:24px;margin-top:24px">
        <div style="font-size:13.5px;font-weight:700;color:var(--ink)">'파워형'에 가까운 리듬이에요</div>
        <div class="cp" style="padding-top:4px">길게 끌어 올렸다가 빠르게 내려치는 편입니다.</div>
      </div>
      <div style="padding-top:18px"><div class="cp" style="padding-bottom:6px">이름 붙이기</div>
        <div class="card" style="color:var(--ink);font-size:13.5px;font-weight:500">7월 드라이버</div></div>
      <div style="flex:1"></div>
      <div class="btn pri">이 템포로 바로 연습</div>
      <div class="mut" style="text-align:center;padding:16px 0">저장만 하기</div>
    </div>`],

  ['⑥ 기록', '"며칠 했는지"가 평균보다 먼저', `
    <div class="body">
      <div class="h1s">기록</div>
      <div class="cp" style="padding-top:6px">이번 주 4일 · 48분</div>
      <div style="display:flex;gap:11px;padding-top:20px">
        <div class="card" style="flex:1"><div class="cp">평균 템포</div><div class="num" style="font-size:26px;padding-top:4px">3.1:1</div>
          <div style="display:flex;align-items:center;gap:4px;padding-top:3px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round"><path d="M3 17l5.5-5.5 3.5 3.5L21 6"/><path d="M16 6h5v5"/></svg><span style="font-size:11px;font-weight:500;color:var(--primary)">지난주 대비 +0.1</span></div></div>
        <div class="card" style="flex:1"><div class="cp">연속</div><div class="num" style="font-size:26px;padding-top:4px">3일</div><div class="cp" style="padding-top:3px">이어가는 중</div></div>
      </div>
      <div style="padding-top:18px">
        ${[['어제','12분 · 내 스윙','3.2:1'],['7월 27일','8분 · 균형형','2.5:1'],['7월 24일','20분 · 내 스윙','3.2:1']]
          .map(([d,s,r])=>`<div class="li"><div><div style="font-size:13.5px;font-weight:700;color:var(--ink)">${d}</div><div class="cp" style="padding-top:2px">${s}</div></div><div class="num" style="font-size:16px">${r}</div></div>`).join('')}
      </div>
    </div>${TAB(2)}`],

  ['⑦ 설정', '접근성을 위로, 라이선스 고지는 아래', `
    <div class="body">
      <div style="color:var(--ink);font-size:17px;padding-bottom:14px">‹</div>
      <div class="h1s">설정</div>
      <div style="padding-top:18px"><div class="cp" style="padding-bottom:6px">화면</div>
        <div class="card" style="border-radius:24px"><div class="row"><span style="font-size:13.5px;font-weight:500;color:var(--ink)">테마</span>
          <div class="seg" style="width:170px"><span>라이트</span><span class="on">다크</span><span>자동</span></div></div></div></div>
      <div style="padding-top:18px"><div class="cp" style="padding-bottom:6px">소리 · 진동</div>
        <div class="card" style="border-radius:24px">
          <div class="row"><div><div style="font-size:13.5px;font-weight:500;color:var(--ink)">비프 볼륨</div><div class="cp" style="padding-top:2px">80%</div></div>
            <div style="display:flex;gap:5px">${[40,60,80,100].map(v=>`<span style="width:33px;text-align:center;padding:6px 0;border-radius:12px;font-family:'Space Grotesk';font-size:11px;${v===80?'background:var(--primary);color:var(--onPrimary)':'background:var(--surface2);color:var(--muted)'}">${v}</span>`).join('')}</div></div>
          <div class="hr" style="margin:6px 0"></div>
          <div class="row" style="padding:8px 0"><span style="font-size:13.5px;font-weight:500;color:var(--ink)">임팩트에 진동</span><span class="sw on"><i></i></span></div>
          <div class="hr" style="margin:6px 0"></div>
          <div class="row" style="padding:8px 0"><span style="font-size:13.5px;font-weight:500;color:var(--ink)">화면 항상 켜기</span><span class="sw on"><i></i></span></div>
        </div></div>
      <div style="padding-top:18px"><div class="cp" style="padding-bottom:6px">접근성</div>
        <div class="card" style="border-radius:24px"><div class="row"><span style="font-size:13.5px;font-weight:500;color:var(--ink)">글자 크기</span>

const grid = document.getElementById('grid');
grid.innerHTML = SCREENS.map(([cap, sub, inner]) =>
  `<div class="cell"><div class="cap">${cap}</div><div class="subcap">${sub}</div>
   <div class="phone"><div class="screen">${inner}</div></div></div>`).join('');

const bl = document.getElementById('bl'), bd = document.getElementById('bd');
function setMode(dark){
  document.body.classList.toggle('dark', dark);
  document.body.style.background = dark ? '#0A0D0A' : '#EDEAE0';
  document.querySelectorAll('h1,.cap').forEach(e => e.style.color = dark ? '#F2F5EE' : '');
  document.querySelectorAll('.lede,.subcap,.note').forEach(e => e.style.color = dark ? '#8A9585' : '');
  bl.classList.toggle('on', !dark); bd.classList.toggle('on', dark);
}
bl.onclick = () => setMode(false);
bd.onclick = () => setMode(true);
</script>
