<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="#436437"/>

  <!-- 3-beat tempo bars along the base: 저음 / 중음 / 강조음 (flat colors, no gradient) -->
  <rect x="270" y="660" width="90" height="180" rx="26" fill="#859A7D"/>
  <rect x="392" y="580" width="90" height="260" rx="26" fill="#D4AF37"/>
  <rect x="514" y="470" width="90" height="370" rx="26" fill="#F0D477"/>

  <!-- rhythm pulse rings emanating from the ball -->
  <circle cx="662" cy="360" r="180" fill="none" stroke="#C9932B" stroke-opacity="0.35" stroke-width="12"/>
  <circle cx="662" cy="360" r="132" fill="none" stroke="#C9932B" stroke-opacity="0.55" stroke-width="14"/>

  <!-- golf ball resting on the tallest (accent) bar, flat fill -->
  <circle cx="662" cy="360" r="98" fill="#F7F1E0"/>
  <g fill="#C9C2A0" opacity="0.6">
    <circle cx="634" cy="326" r="6"/>
    <circle cx="662" cy="318" r="6"/>
    <circle cx="690" cy="326" r="6"/>
    <circle cx="622" cy="352" r="6"/>
    <circle cx="648" cy="348" r="6"/>
    <circle cx="676" cy="348" r="6"/>
    <circle cx="702" cy="352" r="6"/>
    <circle cx="634" cy="378" r="6"/>
    <circle cx="662" cy="374" r="6"/>
    <circle cx="690" cy="378" r="6"/>
    <circle cx="648" cy="400" r="6"/>
    <circle cx="676" cy="400" r="6"/>
  </g>
</svg>
